<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="ui.app.title"></title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@500&display=swap">
<link rel="stylesheet" href="css/pixel.css">
</head>
<body>

<header class="topbar">
  <span id="time-icon"></span>
  <div>
    <div id="st-phase" class="phase-label" aria-live="polite"></div>
    <div id="phase-track" class="track" role="img"></div>
  </div>
  <div id="ws-status" class="conn" role="status"><span class="conn-text"></span></div>
</header>

<div id="toast" class="toast" role="alert" hidden></div>

<main id="app">

<!-- Setup ───────────────────────────────────────────────────────────────── -->
<section id="view-setup" class="view" hidden>
  <a href="/loup_garou/game/launcher.html" class="back-link" data-i18n="ui.app.home"></a>
  <h1 data-i18n="ui.setup.title"></h1>

  <div class="panel stack">
    <div>
      <h2 data-i18n="ui.setup.players"></h2>
      <p class="hint" data-i18n="ui.setup.players_hint"></p>
    </div>
    <div id="setup-player-list" class="stack"></div>
    <button id="btn-add-player" type="button" class="btn btn-small" data-i18n="ui.setup.add_player"></button>
  </div>

  <div class="panel stack">
    <div>
      <div class="spread">
        <h2 data-i18n="ui.setup.roles"></h2>
        <span id="role-total-label" class="badge"></span>
      </div>
      <p class="hint" data-i18n="ui.setup.roles_hint"></p>
    </div>
    <div id="setup-role-slots" class="role-list"></div>
  </div>

  <p id="setup-hint" class="setup-hint" aria-live="polite"></p>
  <p id="version-footer" class="version"></p>

  <div class="dock">
    <div class="dock-actions">
      <button id="btn-start-game" type="button" class="btn btn-primary" data-i18n="ui.setup.start_game" disabled></button>
    </div>
  </div>
</section>

<!-- Role reveal ─────────────────────────────────────────────────────────── -->
<section id="view-reveal" class="view" hidden>
  <p id="reveal-intro" class="lede intro" data-i18n="phase.role_reveal.start" hidden></p>
  <div class="handoff stack">
    <p class="dim" data-i18n="ui.reveal.pass_to"></p>
    <h1 id="reveal-player-label"></h1>
    <p id="reveal-progress" class="dim small"></p>
  </div>

  <div class="reveal-stage">
    <div id="reveal-card" class="reveal-card" role="button" tabindex="0" aria-pressed="false">
      <div class="card-face card-front">
        <span id="reveal-emblem"></span>
        <span class="reveal-tap" data-i18n="ui.reveal.tap_to_reveal"></span>
      </div>
      <div class="card-face card-back" aria-hidden="true" inert>
        <span id="reveal-sprite"></span>
        <div id="reveal-role-name" class="reveal-role-name"></div>
        <span id="reveal-team" class="badge"></span>
        <p id="reveal-role-desc" class="reveal-role-desc"></p>
      </div>
    </div>
  </div>

  <div class="dock">
    <div class="dock-actions">
      <button id="btn-reveal-seen" type="button" class="btn btn-primary" data-i18n="ui.reveal.hide_and_pass" hidden></button>
    </div>
  </div>
</section>

<!-- Night ───────────────────────────────────────────────────────────────── -->
<section id="view-night" class="view" hidden>

  <div id="night-sleeping" class="sleep">
    <span id="sleep-moon"></span>
    <h1 id="night-heading"></h1>
    <p class="lede dim" data-i18n="ui.night.sleeping"></p>
  </div>

  <div id="night-action" class="stack" hidden>
    <div class="role-head">
      <span id="na-sprite"></span>
      <h1 id="na-role-name"></h1>
    </div>
    <p id="na-prompt" class="lede"></p>

    <div id="na-victim" class="panel victim" hidden></div>

    <div id="na-witch-potions" class="potions" hidden>
      <button id="witch-save-btn" type="button" class="btn" aria-pressed="false">
        <span id="witch-save-icon"></span><span id="witch-save-label"></span>
      </button>
      <button id="witch-poison-btn" type="button" class="btn" data-variant="poison" aria-pressed="false">
        <span id="witch-poison-icon"></span><span id="witch-poison-label"></span>
      </button>
    </div>

    <p id="na-status" class="night-status" aria-live="polite" hidden></p>
    <div id="na-grid"></div>
  </div>

  <div id="night-seer" class="stack vision" hidden>
    <span id="seer-sprite"></span>
    <p class="dim" data-i18n="ui.night.seer_sees"></p>
    <div class="panel stack vision">
      <span id="seer-avatar"></span>
      <div id="seer-name" class="who-big"></div>
      <div id="seer-role" class="role-big"></div>
    </div>
  </div>

  <div class="dock">
    <div class="dock-actions">
      <button id="btn-na-skip" type="button" class="btn btn-secondary" data-i18n="ui.night.skip" hidden></button>
      <button id="btn-na-confirm" type="button" class="btn btn-primary" data-i18n="ui.night.confirm" hidden></button>
      <button id="btn-seer-ack" type="button" class="btn btn-primary" data-i18n="ui.night.seer_ack" hidden></button>
    </div>
  </div>
</section>

<!-- Day ─────────────────────────────────────────────────────────────────── -->
<section id="view-day" class="view" hidden>
  <h1 id="day-heading"></h1>
  <div id="day-announcement" class="panel announcement" aria-live="polite"></div>
  <div class="stack">
    <div class="spread">
      <h2 data-i18n="ui.day.villagers"></h2>
      <span id="day-alive" class="dim small"></span>
    </div>
    <div id="day-grid"></div>
  </div>

  <div class="dock">
    <div class="dock-actions">
      <button id="btn-day-night" type="button" class="btn btn-secondary" data-i18n="ui.day.next_night"></button>
      <button id="btn-day-vote" type="button" class="btn btn-danger" data-i18n="ui.day.start_vote"></button>
    </div>
  </div>
</section>

<!-- Vote ────────────────────────────────────────────────────────────────── -->
<section id="view-vote" class="view" hidden>
  <div class="handoff stack">
    <p class="dim" data-i18n="ui.vote.pass_to"></p>
    <h1 id="vote-voter-name"></h1>
    <p id="vote-progress" class="dim small" aria-live="polite"></p>
  </div>
  <h2 data-i18n="ui.vote.select_target"></h2>
  <div id="vote-grid"></div>

  <div class="dock">
    <div class="dock-actions">
      <button id="btn-vote-confirm" type="button" class="btn btn-danger" data-i18n="ui.vote.confirm" disabled></button>
    </div>
  </div>
</section>

<!-- Game over ───────────────────────────────────────────────────────────── -->
<section id="view-game-over" class="view" hidden>
  <div id="go-banner" class="panel winner">
    <span id="go-sprite"></span>
    <p id="go-msg" class="winner-msg"></p>
  </div>
  <h2 data-i18n="ui.game_over.roles"></h2>
  <div id="go-grid"></div>

  <div class="dock">
    <div class="dock-actions">
      <button id="btn-restart" type="button" class="btn btn-primary" data-i18n="ui.game_over.restart"></button>
    </div>
  </div>
</section>

</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
