<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="launcher.title"></title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@500&display=swap">
<link rel="stylesheet" href="css/pixel.css">
</head>
<body class="launcher">

<header class="topbar">
  <span id="time-icon"></span>
  <div>
    <div class="phase-label" data-i18n="launcher.title"></div>
    <div class="subtitle dim small" data-i18n="launcher.subtitle"></div>
  </div>
  <div id="ha-connection" class="conn" role="status"><span class="conn-text"></span></div>
</header>

<main>
<div class="view">

  <div class="tabs" role="tablist" data-i18n-aria-label="launcher.tabs">
    <button class="tab" role="tab" id="tab-btn-play" aria-controls="tab-play" aria-selected="true" data-i18n="launcher.tab.play"></button>
    <button class="tab" role="tab" id="tab-btn-rules" aria-controls="tab-rules" aria-selected="false" tabindex="-1" data-i18n="launcher.tab.rules"></button>
    <button class="tab" role="tab" id="tab-btn-config" aria-controls="tab-config" aria-selected="false" tabindex="-1" data-i18n="launcher.tab.config"></button>
  </div>

  <!-- Play ─────────────────────────────────────────────────────────────── -->
  <section id="tab-play" class="stack" role="tabpanel" aria-labelledby="tab-btn-play">
    <div class="panel stack">
      <span id="play-art"></span>
      <p class="lede" data-i18n="launcher.play.intro"></p>
      <a href="/loup_garou/game/index.html" class="btn btn-primary btn-wide" data-i18n="launcher.play.open"></a>
    </div>
    <div class="panel stack">
      <h2 data-i18n="launcher.summary.title"></h2>
      <ul id="config-summary" class="summary"></ul>
    </div>
  </section>

  <!-- Rules ────────────────────────────────────────────────────────────── -->
  <section id="tab-rules" class="stack rules" role="tabpanel" aria-labelledby="tab-btn-rules" hidden>
    <div class="panel stack">
      <h2 data-i18n="launcher.rules.story_title"></h2>
      <p data-i18n="launcher.rules.story"></p>
    </div>
    <div class="panel stack">
      <h2 data-i18n="launcher.rules.round_title"></h2>
      <ol>
        <li data-i18n="launcher.rules.step1"></li>
        <li data-i18n="launcher.rules.step2"></li>
        <li data-i18n="launcher.rules.step3"></li>
        <li data-i18n="launcher.rules.step4"></li>
      </ol>
    </div>
    <div class="panel stack">
      <h2 data-i18n="launcher.rules.win_title"></h2>
      <ul class="wins">
        <li data-team="village" data-i18n="launcher.rules.win_village"></li>
        <li data-team="wolves" data-i18n="launcher.rules.win_wolves"></li>
        <li data-team="lovers" data-i18n="launcher.rules.win_lovers"></li>
      </ul>
    </div>
    <div class="panel">
      <h2 data-i18n="launcher.rules.roles_title"></h2>
      <div id="role-ref"></div>
    </div>
  </section>

  <!-- Game setup ───────────────────────────────────────────────────────── -->
  <section id="tab-config" class="stack" role="tabpanel" aria-labelledby="tab-btn-config" hidden>

    <div class="panel stack">
      <h2 data-i18n="launcher.config.voice_title"></h2>
      <div class="field-group">
        <label class="label" for="cfg-audio-source" data-i18n="launcher.config.audio_source"></label>
        <select id="cfg-audio-source" class="field">
          <option value="static" data-i18n="launcher.config.audio_source.static"></option>
          <option value="tts" data-i18n="launcher.config.audio_source.tts"></option>
        </select>
      </div>
      <div class="field-group">
        <label class="label" for="cfg-audio-output" data-i18n="launcher.config.audio_output"></label>
        <select id="cfg-audio-output" class="field">
          <option value="browser" data-i18n="launcher.config.audio_output.browser"></option>
          <option value="ha" data-i18n="launcher.config.audio_output.ha"></option>
        </select>
      </div>
      <div id="cfg-ha-fields" class="stack">
        <div class="field-group">
          <label class="label" for="cfg-speaker" data-i18n="launcher.config.speaker"></label>
          <select id="cfg-speaker" class="field"></select>
        </div>
        <div class="field-group" id="cfg-tts-engine-group">
          <label class="label" for="cfg-tts-engine" data-i18n="launcher.config.tts_engine"></label>
          <input id="cfg-tts-engine" class="field" type="text" autocomplete="off" data-i18n-placeholder="launcher.config.tts_engine_placeholder">
        </div>
      </div>
      <div class="row">
        <button id="btn-test-audio" type="button" class="btn btn-small" data-i18n="launcher.config.test_audio"></button>
        <span id="test-audio-feedback" class="feedback small" role="status"></span>
      </div>
    </div>

    <div class="panel stack">
      <h2 data-i18n="launcher.config.room_title"></h2>
      <div class="field-group">
        <span class="label" id="cfg-lights-label" data-i18n="ui.config.lights_label"></span>
        <div class="lights-picker" id="lights-picker">
          <div class="field lights-field" id="cfg-lights-field" role="combobox" tabindex="0"
               aria-haspopup="listbox" aria-expanded="false" aria-controls="cfg-lights-panel" aria-labelledby="cfg-lights-label">
            <span id="cfg-lights-chips" class="lights-chips"></span>
            <span id="cfg-lights-placeholder" class="dim" data-i18n="ui.config.lights_placeholder"></span>
          </div>
          <div class="panel lights-panel" id="cfg-lights-panel" hidden>
            <input id="cfg-lights-search" class="field" type="search" autocomplete="off"
                   data-i18n-placeholder="ui.config.lights_search" data-i18n-aria-label="ui.config.lights_search">
            <div class="lights-toolbar">
              <button type="button" class="btn btn-small" id="cfg-lights-all" data-i18n="ui.config.lights_select_all"></button>
              <button type="button" class="btn btn-small" id="cfg-lights-clear" data-i18n="ui.config.lights_clear"></button>
              <span class="count" id="cfg-lights-count"></span>
            </div>
            <ul class="lights-list" id="cfg-lights-list" role="listbox" aria-multiselectable="true" aria-labelledby="cfg-lights-label"></ul>
          </div>
        </div>
        <p class="hint" data-i18n="ui.config.lights_hint"></p>
      </div>
      <div class="field-group">
        <label class="label" for="cfg-language" data-i18n="launcher.config.language"></label>
        <select id="cfg-language" class="field">
          <option value="fr" data-i18n="launcher.lang.fr"></option>
          <option value="en" data-i18n="launcher.lang.en"></option>
        </select>
      </div>
      <button id="btn-save-config" type="button" class="btn btn-primary btn-wide" data-i18n="launcher.config.save"></button>
      <p id="save-feedback" class="feedback" role="status"></p>
    </div>

    <div class="panel stack">
      <h2 data-i18n="demo.title"></h2>
      <p class="hint" data-i18n="demo.hint"></p>
      <div class="field-group">
        <label class="label" for="demo-preset" data-i18n="demo.preset_label"></label>
        <select id="demo-preset" class="field"></select>
      </div>
      <div class="row">
        <button id="btn-run-demo" type="button" class="btn btn-small" data-i18n="demo.run"></button>
        <button id="btn-stop-demo" type="button" class="btn btn-small" data-i18n="demo.stop" disabled></button>
      </div>
      <p id="demo-log" class="feedback small" role="status"></p>
    </div>
  </section>

  <p id="version-footer" class="version"></p>
</div>
</main>

<div class="dock"><div class="dock-actions"></div></div>

<script type="module" src="js/launcher.js"></script>
</body>
</html>
