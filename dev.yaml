# Loup Garou dev configuration for testing
language: en
tts_mode: mock
tts_engine: tts.cloud_say
speaker: ""
lights: ["light.living_room", "light.bedroom"]
port: 8099

tts_delays:
  night_start: 1.0
  role_wake: 0.5
  role_sleep: 0.5
  day_no_death: 0.5
  day_with_death: 0.5
  vote_start: 0.5
  vote_result: 0.5
  elimination_live: 0.5
  game_over: 0.5

# Non-interactive console mode
players: ["Alice", "Bob", "Charlie", "David"]
roles: ["werewolf", "seer", "villager", "villager"]